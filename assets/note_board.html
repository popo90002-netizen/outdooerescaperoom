<title>음표 놀이판</title>
<style>
  html,body{margin:0;height:100%;background:#1c1a17;color:#f3e6c4;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;box-sizing:border-box}
  .board{position:relative;width:100%;max-width:1000px;aspect-ratio:1164/705;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  .board img{width:100%;height:100%;display:block;pointer-events:none}
  .key{position:absolute;width:8.2%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;touch-action:none}
  .key::after{content:"";position:absolute;inset:0;border-radius:50%;opacity:0;box-shadow:0 0 0 0 var(--c);transition:opacity .4s}
  .key.on::after{opacity:1;animation:ring .5s ease-out}
  @keyframes ring{0%{box-shadow:0 0 0 0 var(--c),inset 0 0 18px var(--c);opacity:1}100%{box-shadow:0 0 0 22px transparent,inset 0 0 0 transparent;opacity:0}}
  .intro{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:22%;pointer-events:none;transition:opacity .6s}
  .intro span{background:rgba(20,16,10,.72);color:#fff;font-weight:700;font-size:clamp(15px,3.6vw,26px);padding:.55em 1.1em;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.35);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .intro.hide{opacity:0}
</style>

      // 1샘플 버퍼 재생으로 Web Audio 깨우기
      const buf=ctx.createBuffer(1,1,22050),src=ctx.createBufferSource();
      src.buffer=buf; src.connect(ctx.destination); src.start(0);
      unlocked=true;
    }
  }catch(e){ setTimeout(()=>showState("오류: "+e.message),0); }
}
["touchend","pointerup","click","keydown"].forEach(ev=>document.addEventListener(ev,unlock,{passive:true}));
function ac(){ unlock(); return ctx; }
function showState(){}
// 장난감 철금: 배음 많고 살짝 쨍, 짧게
const SR=44100, DUR=0.8;
function synth(f){
  const len=Math.floor(SR*DUR), y=new Float32Array(len);
  const parts=[[1,1,0.3],[2.76,0.45,0.12],[5.4,0.25,0.05],[8.9,0.1,0.02]];
  let seed=7, hp=0, prev=0;
  for(let i=0;i<len;i++){
    const t=i/SR; let v=0;
    for(const [m,g,tau] of parts){ const fm=f*m; if(fm<SR/2) v+=g*Math.exp(-t/tau)*Math.sin(2*Math.PI*fm*t); }
    v*=Math.min(1,t/0.001);
    // 채로 치는 '틱' 소리
    seed=(seed*16807)%2147483647; const n=(seed/2147483647*2-1)*Math.exp(-t/0.004);
    hp=0.9*(hp+n-prev); prev=n; v+=0.3*hp;
    v*=Math.min(1,(DUR-t)/0.05);
    y[i]=v*0.42;
  }
  return y;
}
const bufCache={};
function play(f){
  const a=ac(); if(!a) return;
  let b=bufCache[f];
  if(!b){ const d=synth(f); b=a.createBuffer(1,d.length,SR); b.getChannelData(0).set(d); bufCache[f]=b; }
  const src=a.createBufferSource(); src.buffer=b; src.connect(a.destination); src.start();
}
// 맥/PC용: 각 음을 wav 파일로 미리 만들어 <audio>로 재생
function noteWav(f){
  const d=synth(f), n=d.length*2, b=new ArrayBuffer(44+n), v=new DataView(b);
  const s=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
  s(0,"RIFF");v.setUint32(4,36+n,true);s(8,"WAVE");s(12,"fmt ");v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);s(36,"data");v.setUint32(40,n,true);
  for(let i=0;i<d.length;i++) v.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]))*32767,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}));
}
const wavs=isTouch?null:notes.map(k=>noteWav(k.f));
function playFile(i){
  try{ const a=new Audio(wavs[i]); a.volume=1; const p=a.play(); if(p&&p.catch) p.catch(e=>showState("재생 실패: "+e.name)); }
  catch(e){ showState("재생 실패: "+e.message); }
}
const board=document.getElementById("board");
const intro=document.getElementById("intro");
function hideIntro(){ intro.classList.add("hide"); }
notes.forEach((k,i)=>{
  const el=document.createElement("div");
  el.className="key"; el.style.left=(k.x/W*100)+"%"; el.style.top=(k.y/H*100)+"%";
  el.style.setProperty("--c",k.c);
  el.setAttribute("aria-label",k.n);
  let pending=false;
  const hit=()=>{
    if(wavs) playFile(i); else play(k.f);
    el.classList.remove("on"); void el.offsetWidth; el.classList.add("on");
    hideIntro();
  };
  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    if(wavs || (ctx && ctx.state==="running")){ hit(); }
    else { pending=true; unlock(); }   // 첫 터치: 소리 잠금 해제 후 손 뗄 때 재생
  });
  const release=()=>{ if(pending){ pending=false; unlock(); setTimeout(hit,0); } };
  el.addEventListener("pointerup",release);
  el.addEventListener("click",release);
  board.appendChild(el);
});
</script>
